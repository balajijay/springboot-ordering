server:
  port: 8000

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      mvc:
        default-filters:
          - TokenRelay=  # Correct MVC syntax to forward the Azure token to backend services
        routes:
          - id: order-service
            uri: http://localhost:8080
            predicates:
              - Path=/api/orders/**
            filters:
              - AddRequestHeader=X-Gateway-Validation, SecuredByGateway

          - id: inventory-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/inventory/**
            filters:
              - AddRequestHeader=X-Gateway-Validation, SecuredByGateway

          # 🟢 ADD THE PRODUCT SERVICE ROUTING BLOCK HERE
          - id: product-service
            uri: http://localhost:8085
            predicates:
              - Path=/api/v1/products/**
            filters:
              - AddRequestHeader=X-Gateway-Validation, SecuredByGateway			

  # Microsoft Azure Entra ID Configuration
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - offline_access
            # This must exactly match what you registered in the Azure Portal
            redirect-uri: "http://localhost:8000/login/oauth2/code/azure"
            provider: azure
            authorization-grant-type: authorization_code
        provider:
          azure:
            # Replace 'common' with your specific Azure Tenant ID if you selected a single-tenant setup
            issuer-uri: https://login.microsoftonline.com/63881c03-e4df-45ce-aa4b-e12abff3eb26/v2.0
